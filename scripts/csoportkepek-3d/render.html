<!doctype html>
<html><head><meta charset="utf-8">
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<script type="importmap">{"imports":{"three":"./node_modules/three/build/three.module.js","three/addons/":"./node_modules/three/examples/jsm/"}}</script>
</head><body>
<script type="module">
import * as THREE from 'three';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const W = 1200, H = 750;
const scene = new THREE.Scene();
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(1);
renderer.setSize(W, H);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.VSMShadowMap;
document.body.appendChild(renderer.domElement);
const pmrem = new THREE.PMREMGenerator(renderer);
// stúdió környezet: sötétebb szürke tér, néhány erős softbox -> a fémeken kontrasztos csíkos tükröződés
const env = new THREE.Scene();
env.add(new THREE.Mesh(new THREE.SphereGeometry(20, 32, 16), new THREE.MeshBasicMaterial({ color: 0x8d949e, side: THREE.BackSide })));
const floorE = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.MeshBasicMaterial({ color: 0x9aa2ad })); floorE.rotation.x = -Math.PI / 2; floorE.position.y = -3; env.add(floorE);
for (const [x, y, z, w, h, k] of [[0, 9, 0, 14, 5, 6], [-10, 3, 4, 3, 10, 4], [9, 4, -6, 2, 12, 3], [3, 2, 10, 10, 2.5, 2.2], [-4, 1, -10, 8, 2, 1.8]]) {
  const p = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(k, k, k), side: THREE.DoubleSide }));
  p.position.set(x, y, z); p.lookAt(0, 0, 0); env.add(p);
}
scene.environment = pmrem.fromScene(env, 0.02).texture;

const key = new THREE.DirectionalLight(0xffffff, 2.2);
key.position.set(-3, 6, 4);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
key.shadow.radius = 12; key.shadow.blurSamples = 20;
Object.assign(key.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6, near: 0.5, far: 30 });
scene.add(key);
scene.add(new THREE.HemisphereLight(0xffffff, 0xdfe6f2, 0.6));

const ground = new THREE.Mesh(new THREE.PlaneGeometry(40, 40), new THREE.ShadowMaterial({ opacity: 0.18 }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);

// ---- anyagok
const alu = new THREE.MeshPhysicalMaterial({ color: 0xc3c9d1, metalness: 1, roughness: 0.28 });
const aluDark = new THREE.MeshPhysicalMaterial({ color: 0x9aa3ae, metalness: 1, roughness: 0.34 });
const anod = new THREE.MeshPhysicalMaterial({ color: 0xd0d5dc, metalness: 0.95, roughness: 0.2, clearcoat: 0.3 });
const rubber = new THREE.MeshPhysicalMaterial({ color: 0x1c1e22, metalness: 0, roughness: 0.62, sheen: 0.4, sheenColor: 0x444444 });
const grp = new THREE.MeshPhysicalMaterial({ color: 0xf6f7f8, metalness: 0, roughness: 0.18, clearcoat: 1, clearcoatRoughness: 0.08 });
const steel = new THREE.MeshPhysicalMaterial({ color: 0x3a3f47, metalness: 0.6, roughness: 0.45, clearcoat: 0.5 });

function canvasTex(w, h, draw, repeat = [1, 1]) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
function mesh(geo, mat, x = 0, y = 0, z = 0, rx = 0, ry = 0, rz = 0) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); m.rotation.set(rx, ry, rz);
  m.castShadow = true; m.receiveShadow = true; scene.add(m); return m;
}
// 2D keresztmetszet (mm) -> hosszan kihúzott profil (m); a profil a Z tengely mentén fut
function shape(pts, holes = []) {
  const s = new THREE.Shape(pts.map(([x, y]) => new THREE.Vector2(x / 1000, y / 1000)));
  for (const h of holes) s.holes.push(new THREE.Path(h.map(([x, y]) => new THREE.Vector2(x / 1000, y / 1000))));
  return s;
}
function extrude(s, len, bevel = 0.0012) {
  const g = new THREE.ExtrudeGeometry(s, { depth: len, bevelEnabled: bevel > 0, bevelThickness: bevel, bevelSize: bevel * 0.8, bevelSegments: 2, curveSegments: 24 });
  g.translate(0, 0, -len / 2); g.computeVertexNormals(); return g;
}
const rect = (x, y, w, h) => [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
function camera(pos, look, fov = 30) {
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.05, 100); cam.position.set(...pos); cam.lookAt(...look); return cam;
}

// ---- jelenetek: keresztmetszet mm-ben, a darabok a talajon fekszenek (Z irányban futnak)
function lay(s, len, mat, x, z, ry = 0, y = 0) { return mesh(extrude(s, len), mat, x, y, z, 0, ry, 0); }
const rhs = (w, h, t) => shape(rect(0, 0, w, h), [rect(t, t, w - 2 * t, h - 2 * t)]);
const tube = (d, t) => { const s = new THREE.Shape(); s.absarc(d / 2000, d / 2000, d / 2000, 0, Math.PI * 2); const p = new THREE.Path(); p.absarc(d / 2000, d / 2000, (d / 2 - t) / 1000, 0, Math.PI * 2, true); s.holes.push(p); return s; };
const ang = (a, b, t) => shape([[0, 0], [a, 0], [a, t], [t, t], [t, b], [0, b]]);
const arc = (cx, cy, r, a0, a1, n = 12) => Array.from({ length: n + 1 }, (_, i) => { const a = a0 + (a1 - a0) * i / n; return [cx + r * Math.cos(a), cy + r * Math.sin(a)]; });
const SCENES = {
  'aluminium-alvaz-profilok'() {
    const I = shape([[0, 0], [140, 0], [140, 14], [78, 14], [78, 226], [140, 226], [140, 240], [0, 240], [0, 226], [62, 226], [62, 14], [0, 14]]);
    const U = shape([[0, 0], [80, 0], [80, 8], [8, 8], [8, 152], [80, 152], [80, 160], [0, 160]]);
    const U2 = shape([[0, 0], [100, 0], [100, 50], [92, 50], [92, 6], [8, 6], [8, 50], [0, 50]]);
    lay(I, 1.3, alu, 0, 0);
    lay(U, 1.1, anod, 0.2, 0.18);
    lay(U2, 0.95, aluDark, 0.34, 0.3);
    lay(rhs(100, 50, 4), 1.0, alu, -0.16, 0.24);
    return { dir: [1.0, 0.62, 1.35], fov: 26 };
  },
  'aluminium-padlo-profilok'() {
    const pts = [[0, 0], [200, 0], [200, 30], [208, 30], [208, 36], [200, 36], [200, 40]];
    for (let x = 196; x > 10; x -= 12) pts.push([x, 40], [x - 2, 44], [x - 7, 44], [x - 9, 40]);
    pts.push([0, 40], [0, 18], [-8, 18], [-8, 12], [0, 12]);
    const s = shape(pts, [rect(6, 5, 58, 29), rect(71, 5, 58, 29), rect(136, 5, 58, 29)]);
    for (let i = 0; i < 3; i++) lay(s, 1.2, i % 2 ? alu : anod, i * 0.212, i * 0.1);
    return { dir: [0.75, 0.65, 1.35], fov: 26 };
  },
  'ponyvas-oldalfal-profilok-es-szegok'() {
    // kamrás oldalfal palló (fekve), nút-féder illesztéssel + U szegő
    const pts = [[0, 0], [250, 0], [250, 22], [244, 22], [244, 26], [236, 26], [236, 22], [230, 22], [230, 25], [0, 25], [0, 16], [-6, 16], [-6, 8], [0, 8]];
    const s = shape([[0, 0], [250, 0], [250, 25], [0, 25], [0, 17], [-6, 17], [-6, 8], [0, 8]], [rect(4, 3, 72, 19), rect(86, 3, 72, 19), rect(168, 3, 76, 19)]);
    lay(s, 1.2, anod, 0, 0);
    lay(s, 1.05, alu, 0.27, 0.12);
    lay(s, 0.9, anod, 0.02, 0.2, 0, 0.026);
    const edge = shape([[0, 0], [36, 0], [36, 62], [30, 62], [30, 6], [6, 6], [6, 62], [0, 62]]);
    lay(edge, 1.0, alu, 0.56, 0.1);
    return { dir: [0.8, 0.75, 1.3], fov: 26 };
  },
  'zart-dobozos-es-hutos-profilok'() {
    const corner = shape([[0, 0], [100, 0], [100, 3], [50, 3], ...arc(50, 50, 47, -Math.PI / 2, -Math.PI, 16), [3, 100], [0, 100], [0, 50], ...arc(50, 50, 50, Math.PI, 3 * Math.PI / 2, 16).slice(1, -1)]);
    const gutter = shape([[0, 0], [60, 0], [60, 45], [54, 45], [54, 6], [6, 6], [6, 30], [0, 30]]);
    const Z = shape([[0, 0], [40, 0], [40, 3], [3, 3], [3, 57], [60, 57], [60, 60], [0, 60]]);
    lay(corner, 1.2, anod, 0, 0);
    lay(gutter, 1.05, alu, 0.16, 0.12);
    lay(ang(60, 60, 2.5), 0.9, aluDark, 0.28, 0.22);
    lay(Z, 0.95, alu, -0.12, 0.2);
    return { dir: [0.85, 0.8, 1.3], fov: 26 };
  },
  'ipari-felgyartmanyok'() {
    const items = [[rhs(100, 50, 3), alu, 0, 0], [rhs(60, 30, 2.5), anod, 0.115, 0.05], [rhs(80, 80, 4), aluDark, 0.19, 0.12],
      [tube(60, 3), alu, 0.29, 0.02], [tube(40, 2), anod, 0.37, 0.1], [ang(60, 60, 5), alu, 0.43, 0.04], [shape([[0, 0], [60, 0], [60, 40], [54, 40], [54, 5], [6, 5], [6, 40], [0, 40]]), anod, 0.51, 0.14]];
    items.forEach(([s, m, x, z], i) => lay(s, 1.2 - i * 0.04, m, x, z));
    lay(rhs(60, 40, 3), 1.0, anod, 0.02, 0.16, 0, 0.052);
    lay(tube(50, 3), 0.95, alu, 0.2, 0.22, 0, 0.082);
    return { dir: [0.7, 0.6, 1.4], fov: 24 };
  },
  'aluminium-lemezek'() {
    const tread = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#808080'; g.fillRect(0, 0, w, h);
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
        g.save(); g.translate(x * 64 + 32, y * 64 + 32); g.rotate((x + y) % 2 ? Math.PI / 4 : -Math.PI / 4);
        const gr = g.createLinearGradient(-20, 0, 20, 0); gr.addColorStop(0, '#555'); gr.addColorStop(0.5, '#fff'); gr.addColorStop(1, '#666');
        g.fillStyle = gr; g.beginPath(); g.ellipse(0, 0, 24, 5, 0, 0, Math.PI * 2); g.fill(); g.restore();
      }
    }, [5, 3]);
    const plateMat = new THREE.MeshPhysicalMaterial({ color: 0xb9c0c9, metalness: 1, roughness: 0.3, bumpMap: tread, bumpScale: 4 });
    for (let i = 0; i < 8; i++) mesh(new THREE.BoxGeometry(1.2, 0.005, 0.7), i % 3 === 2 ? aluDark : alu, (i % 2) * 0.01, 0.0025 + i * 0.0065, (i % 3) * 0.008);
    mesh(new THREE.BoxGeometry(1.2, 0.007, 0.7), plateMat, 0.12, 0.058, -0.06, 0, 0.16, 0);
    return { dir: [1.0, 0.95, 1.2], fov: 26 };
  },
  'csuszasmentes-retegelt-padlo'() {
    const hex = canvasTex(512, 512, (g, w, h) => {
      g.fillStyle = '#3f2717'; g.fillRect(0, 0, w, h);
      const r = 14; g.fillStyle = '#6a4428';
      for (let y = 0; y < h + r; y += r * 1.5) for (let x = 0; x < w + r; x += r * Math.sqrt(3)) {
        const ox = (Math.round(y / (r * 1.5)) % 2) * r * Math.sqrt(3) / 2;
        g.beginPath(); for (let k = 0; k < 6; k++) { const a = Math.PI / 3 * k + Math.PI / 6; g.lineTo(x + ox + Math.cos(a) * r * 0.62, y + Math.sin(a) * r * 0.62); } g.fill();
      }
    }, [3, 2]);
    const edge = canvasTex(64, 256, (g, w, h) => {
      for (let i = 0; i < 16; i++) { g.fillStyle = i % 2 ? '#dcb680' : '#c59758'; g.fillRect(0, i * 16, w, 16); }
      g.fillStyle = '#3f2717'; g.fillRect(0, 0, w, 10); g.fillRect(0, h - 10, w, 10);
    });
    const top = new THREE.MeshPhysicalMaterial({ map: hex, roughness: 0.5, bumpMap: hex, bumpScale: 3, clearcoat: 0.3 });
    const side = new THREE.MeshPhysicalMaterial({ map: edge, roughness: 0.75 });
    const mats = [side, side, top, top, side, side];
    for (let i = 0; i < 5; i++) mesh(new THREE.BoxGeometry(1.25, 0.021, 0.62), mats, (i % 2) * 0.02, 0.011 + i * 0.022, (i % 3) * 0.015, 0, (i - 2) * 0.012, 0);
    return { dir: [1.0, 0.85, 1.15], fov: 26 };
  },
  'kedergumik'() {
    const U = shape([[0, 0], [22, 0], [22, 26], [18, 26], [17, 8], [14, 16], [12, 5], [10, 16], [8, 8], [4, 26], [0, 26]]);
    const bulbS = new THREE.Shape(); bulbS.absarc(0.014, 0.014, 0.014, 0, Math.PI * 2); const hh = new THREE.Path(); hh.absarc(0.014, 0.014, 0.009, 0, Math.PI * 2, true); bulbS.holes.push(hh);
    const pts = []; for (let a = 0; a < Math.PI * 2 * 2.6; a += 0.06) { const r = 0.2 - a * 0.009; pts.push(new THREE.Vector3(Math.cos(a) * r, 0, Math.sin(a) * r)); }
    const U2 = new THREE.Shape(new THREE.Shape(U.getPoints()).getPoints().map((p) => new THREE.Vector2(p.x - 0.011, p.y)));
    const coil = new THREE.ExtrudeGeometry(U2, { steps: 500, extrudePath: new THREE.CatmullRomCurve3(pts), bevelEnabled: false });
    const cm = mesh(coil, rubber, -0.12, 0, 0); cm.position.y = 0.013;
    lay(U, 0.7, rubber, 0.16, 0.12);
    lay(bulbS, 0.65, rubber, 0.22, 0.2);
    lay(shape([[0, 0], [30, 0], [30, 4], [19, 4], [27, 22], [23, 24], [15, 6], [9, 6], [5, 26], [0, 26]]), 0.6, rubber, 0.28, 0.1);
    return { dir: [0.8, 1.0, 1.1], fov: 26 };
  },
  'uvegszalas-polieszter'() {
    const t = 0.003; const pts = [];
    for (let a = 0; a < Math.PI * 2 * 4; a += 0.05) { const r = 0.05 + a * 0.004; pts.push([Math.cos(a) * r, Math.sin(a) * r]); }
    const outer = pts.map(([x, y]) => new THREE.Vector2(x, y));
    const inner = pts.slice().reverse().map(([x, y]) => { const l = Math.hypot(x, y); return new THREE.Vector2(x * (l - t) / l, y * (l - t) / l); });
    const s = new THREE.Shape(); s.setFromPoints([...outer, ...inner]);
    const roll = new THREE.ExtrudeGeometry(s, { depth: 1.1, bevelEnabled: false, curveSegments: 4 }); roll.translate(0, 0, -0.55);
    const r0 = 0.05 + Math.PI * 2 * 4 * 0.004;
    mesh(roll, grp, 0, r0 + 0.002, 0, 0, Math.PI / 2, 0);
    mesh(new THREE.BoxGeometry(1.1, t, 0.7), grp, 0, t / 2, r0 + 0.35, 0, 0, 0);
    const blue = new THREE.MeshPhysicalMaterial({ color: 0xdfe8f5, roughness: 0.2, clearcoat: 1 });
    mesh(new THREE.BoxGeometry(0.9, 0.012, 0.5), blue, 0.55, 0.006, -0.3, 0, 0.3, 0);
    return { dir: [1.1, 0.9, 1.3], fov: 26 };
  },
  'hatso-ajtok-es-athajto-rampak'() {
    const pts = [[0, 0], [20, 0], [20, 40]];
    for (let x = 24; x < 346; x += 16) pts.push([x, 40], [x + 3, 46], [x + 8, 46], [x + 11, 40]);
    pts.push([360, 40], [360, 0], [380, 0], [380, 75], [364, 75], [364, 50], [16, 50], [16, 75], [0, 75]);
    const s = shape(pts, [rect(26, 8, 100, 26), rect(140, 8, 100, 26), rect(254, 8, 100, 26)]);
    const r1 = lay(s, 1.5, anod, 0, 0); r1.rotation.x = -0.12; r1.position.y = 0.09;
    const r2 = lay(s, 1.5, alu, 0.48, 0.25); r2.rotation.x = -0.12; r2.position.y = 0.09;
    const block = new THREE.MeshPhysicalMaterial({ color: 0x2b3440, roughness: 0.6 });
    mesh(new THREE.BoxGeometry(1.1, 0.16, 0.12), block, 0.43, 0.08, -0.66);
    return { dir: [1.0, 0.75, 1.25], fov: 26 };
  },
};

function fit({ dir, fov }) {
  const box = new THREE.Box3();
  scene.traverse((o) => { if (o.isMesh && o !== ground) box.expandByObject(o); });
  const c = box.getCenter(new THREE.Vector3()); const r = box.getBoundingSphere(new THREE.Sphere()).radius;
  const d = new THREE.Vector3(...dir).normalize();
  const dist = r / Math.sin(THREE.MathUtils.degToRad(fov) / 2) * 0.6;
  const cam = new THREE.PerspectiveCamera(fov, W / H, 0.01, 100);
  cam.position.copy(c).addScaledVector(d, dist); cam.lookAt(c);
  key.position.copy(c).add(new THREE.Vector3(-2, 5, 3)); key.target.position.copy(c); scene.add(key.target);
  return cam;
}

const name = new URLSearchParams(location.search).get('s');
const cam = fit(SCENES[name]());
renderer.render(scene, cam);
window.DONE = true;
</script>
